{% extends "base.html" %}
{% block title %}Log in · JournalNest{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Welcome back</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn--primary">Log in</button>
  </form>
  <p class="auth-card__alt">New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
</section>
{% endblock %}
